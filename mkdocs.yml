site_name: FMS ITS Interface
site_url: https://monotch-support.github.io/fms-its-interface
repo_url: https://github.com/monotch-support/fms-its-interface
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
nav:
  - Introduction: index.md
  - Authentication: authentication.md
  - REST API: rest-api.md
  - WebSocket interface: websocket.md
  - Event codes: event-codes.md
  - Use cases: use-cases.md
  - Sequence diagrams: sequence-diagrams.md
  - Protobuf specification: protobuf.md
extra_css:
  - stylesheets/width.css
plugins:
  - search
  - include-markdown
  - macros
markdown_extensions:
  - admonition
  - plantuml_markdown
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra:
  version: 1.0.0
